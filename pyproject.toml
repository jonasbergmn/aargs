[project]
name = "aargs"
version = "0.1.0"
description = "Unambitious cli args parser with zero dependencies."
readme = "README.md"
authors = [
    { name = "Jonas Bergmann", email = "joebergmann@outlook.de" }
]
requires-python = ">=3.12"
keywords = ["cli", "argparse", "dataclass", "arguments", "parser", "typed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jonasbergmn/aargs"
Repository = "https://github.com/jonasbergmn/aargs"
Issues = "https://github.com/jonasbergmn/aargs/issues"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
test = [
    "pytest>=9.1.1",
]
